<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>简历工作台 · 本地</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="resume.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 3.8h8.2L19 8.6v11.6H6z" />
            <path d="M14 3.8v5h5" />
            <path d="M9 12h6M9 15.4h4.2" />
          </svg>
        </span>
        <span class="brand-name">简历工作台</span>
        <span class="save-state" id="save-state">已保存</span>
      </div>

      <nav class="top-actions" aria-label="工具栏">
        <button class="tb-btn" type="button" data-panel="theme">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18h1.4a2.1 2.1 0 0 0 0-4.2h-.7a1.6 1.6 0 0 1 0-3.2H16a5 5 0 0 0 5-5c0-3.1-4-5.6-9-5.6Z"/><circle cx="8.2" cy="9.2" r="1"/><circle cx="12" cy="7.4" r="1"/><circle cx="7.2" cy="13.4" r="1"/></svg>
          主题
        </button>
        <button class="tb-btn" type="button" data-panel="sticker">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.6 5.6 6.1.7-4.6 4.1 1.3 6-5.4-3-5.4 3 1.3-6L3.3 9.3l6.1-.7Z"/></svg>
          贴图
        </button>
        <button class="tb-btn" type="button" data-panel="ai">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2 13.7 8l4.8 1.7-4.8 1.7L12 16l-1.7-4.6L5.5 9.7 10.3 8Z"/><path d="M18.4 15.2 19.3 18l2.8.9-2.8.9-.9 2.8-.9-2.8-2.8-.9 2.8-.9Z"/></svg>
          AI 助手
        </button>
        <button class="tb-btn icon-only" type="button" data-panel="settings" title="设置" aria-label="设置">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.1"/><path d="M19.4 14.5a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5v.2a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1h.2a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1Z"/></svg>
        </button>
        <span class="tb-sep" aria-hidden="true"></span>
        <button class="tb-btn" type="button" id="btn-backup" title="把简历数据下载成 JSON 备份">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v11"/><path d="m7.6 10.4 4.4 4.4 4.4-4.4"/><path d="M4.5 16.5v2.2a1.8 1.8 0 0 0 1.8 1.8h11.4a1.8 1.8 0 0 0 1.8-1.8v-2.2"/></svg>
          备份
        </button>
        <button class="tb-btn primary" type="button" id="btn-print" title="用浏览器打印功能导出 PDF（⌘P）">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8V4h10v4"/><rect x="4" y="8" width="16" height="7.5" rx="1.6"/><path d="M7 15.5h10V20H7z"/></svg>
          导出 PDF
        </button>
      </nav>
    </header>

    <div class="service-banner" id="service-banner" hidden>
      <span class="service-dot" aria-hidden="true"></span>
      <div class="service-text">
        <strong id="service-title">本地服务未连接</strong>
        <span id="service-detail"></span>
      </div>
      <button class="service-retry" id="service-retry" type="button">重新检测</button>
    </div>

    <div class="workspace">
      <aside class="outline">
        <div class="outline-head">
          <h2>板块</h2>
          <div class="outline-head-actions">
            <button class="icon-btn" id="btn-add-section" type="button" title="添加板块" aria-label="添加板块">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>
        </div>
        <div class="outline-list" id="outline-list"></div>
        <div class="outline-foot">
          <button class="mini-btn" id="btn-add-section-2" type="button">＋ 添加板块</button>
          <p class="outline-tip">拖动左侧板块可排序；页面上任何文字都能直接点开修改。</p>
        </div>
      </aside>

      <main class="stage" id="stage">
        <div class="stage-scroll" id="stage-scroll">
          <div class="page-scale" id="page-scale">
            <div class="page" id="page"></div>
          </div>
          <div class="stage-pad" aria-hidden="true"></div>
        </div>
        <div class="stage-tools">
          <button class="zoom-btn" id="zoom-out" type="button" aria-label="缩小">−</button>
          <button class="zoom-label" id="zoom-label" type="button" title="点击恢复 100%">100%</button>
          <button class="zoom-btn" id="zoom-in" type="button" aria-label="放大">＋</button>
          <span class="zoom-sep"></span>
          <button class="zoom-btn wide" id="zoom-fit" type="button">适应宽度</button>
          <button class="zoom-btn wide" id="toggle-guide" type="button" title="显示 A4 分页参考线">分页线</button>
        </div>
      </main>

      <aside class="drawer" id="drawer" aria-hidden="true">
        <div class="drawer-head">
          <div class="drawer-tabs" id="drawer-tabs">
            <button class="drawer-tab" type="button" data-tab="theme">主题</button>
            <button class="drawer-tab" type="button" data-tab="sticker">贴图</button>
            <button class="drawer-tab" type="button" data-tab="ai">AI</button>
            <button class="drawer-tab" type="button" data-tab="settings">设置</button>
          </div>
          <button class="icon-btn" id="drawer-close" type="button" aria-label="关闭面板">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <div class="drawer-body" id="drawer-body"></div>
      </aside>
    </div>
  </div>

  <div class="add-menu" id="add-menu" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/util.js"></script>
  <script src="js/data.js"></script>
  <script src="js/render.js"></script>
  <script src="js/panel-theme.js"></script>
  <script src="js/panel-sticker.js"></script>
  <script src="js/panel-ai.js"></script>
  <script src="js/panel-settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
